networks:
  isolated:
    internal: true   # No external connectivity
  public:   # Standard bridge network, created by Compose on docker compose up
services:
  opentenant-platform:
    image: opentenant/platform
    ports:
      - "${PLATFORM_PORT}:${PLATFORM_PORT}"
    environment:
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PORT=${DB_PORT}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - SUPA_CONNECT_CLIENT_ID=${SUPA_CONNECT_CLIENT_ID}
      - SUPA_CONNECT_CLIENT_SECRET=${SUPA_CONNECT_CLIENT_SECRET}
      - VAULT_URL=${VAULT_URL}
      - VAULT_TOKEN=${VAULT_TOKEN}
      - PLATFORM_HOST=${PLATFORM_HOST}
      - WEBAPP_HOST=${WEBAPP_HOST}
      - COOKIE_SECRET=${COOKIE_SECRET}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY}
      - SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY}
      - SUPABASE_JWKS_URL=${SUPABASE_JWKS_URL}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_APP_ID=${GITHUB_APP_ID}
      - GITHUB_APP_SLUG=${GITHUB_APP_SLUG}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GITHUB_APP_PRIVATE_KEY_PATH=${GITHUB_APP_PRIVATE_KEY_PATH}
      - GITLAB_CLIENT_SECRET=${GITLAB_CLIENT_SECRET}
      - GITLAB_CLIENT_ID=${GITLAB_CLIENT_ID}
      - GITLAB_APP_ID=${GITLAB_APP_ID}
      - GITLAB_APP_SLUG=${GITLAB_APP_SLUG}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET}
      - GITLAB_WEBHOOK_SECRET=${GITLAB_WEBHOOK_SECRET}
    networks:
      - isolated
      - public

  opentenant-vault:
    image: hashicorp/vault
    ports:
      - "1234:1234"
    environment:
      - VAULT_LOCAL_CONFIG=${VAULT_LOCAL_CONFIG}
    networks:
      - isolated
      - public
    command: server
    volumes:
    - /etc/vault.d/data:/vault/data
    - /etc/vault.d/file:/vault/file
    - ./vault/plugins:/vault/plugins
    - /etc/vault.d/unseal:/vault/unseal

